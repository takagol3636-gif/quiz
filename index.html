<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KNOA YardBook</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b3d0b;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
color:white;
text-align:center;
}

header{
padding:20px;
font-size:28px;
font-weight:bold;
background:#062806;
}

#menu{
padding:20px;
}

button{
width:90%;
max-width:350px;
padding:18px;
margin:8px;
font-size:22px;
border:none;
border-radius:15px;
background:#1b5e20;
color:white;
cursor:pointer;
}

button:active{
transform:scale(.97);
}

#viewer{
display:none;
padding:15px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

h2{
font-size:28px;
}

.tab{
display:flex;
justify-content:center;
margin-bottom:15px;
gap:10px;
}

.tab button{
width:140px;
font-size:18px;
}

.imageWrap{

overflow:auto;
border-radius:15px;
background:white;
padding:10px;

}

.imageWrap img{

width:100%;
max-width:900px;
transform-origin:center;
touch-action:none;

}

.bottom{

display:flex;
justify-content:space-between;
margin-top:15px;

}

.bottom button{

width:45%;

}

</style>

</head>

<body>

<header>

KNOA YardBook

</header>

<div id="menu">

<h2>穂高カントリークラブ</h2>

<br>

<button onclick="openHole(0)">① Hole1</button>

<button onclick="openHole(1)">② Hole2</button>

<button onclick="openHole(2)">③ Hole3</button>

</div>

<div id="viewer">

<div class="top">

<h2 id="title"></h2>

<button onclick="backMenu()">HOME</button>

</div>

<div class="tab">

<button onclick="showCourse()">コース</button>

<button onclick="showGreen()">グリーン</button>

</div>

<div class="imageWrap">

<img id="img">

</div>

<div class="bottom">

<button onclick="prevHole()">← 前</button>

<button onclick="nextHole()">次 →</button>

</div>

</div>

<script>

const holes=[

{

title:"Hole1 PAR5 575Y",

course:"images/1-course.jpg",

green:"images/1-green.jpg"

},

{

title:"Hole2 PAR4 355Y",

course:"images/2-course.jpg",

green:"images/2-green.jpg"

},

{

title:"Hole3 PAR3 190Y",

course:"images/3-course.jpg",

green:"images/3-green.jpg"

}

];

let current=0;
let mode="course";

function openHole(n){

current=n;

document.getElementById("menu").style.display="none";

document.getElementById("viewer").style.display="block";

load();

}

function load(){

document.getElementById("title").innerHTML=holes[current].title;

if(mode=="course"){

document.getElementById("img").src=holes[current].course;

}else{

document.getElementById("img").src=holes[current].green;

}

}

function showCourse(){

mode="course";

load();

}

function showGreen(){

mode="green";

load();

}

function nextHole(){

if(current<holes.length-1){

current++;

load();

}

}

function prevHole(){

if(current>0){

current--;

load();

}

}

function backMenu(){

document.getElementById("viewer").style.display="none";

document.getElementById("menu").style.display="block";

}

</script>

</body>

</html>
