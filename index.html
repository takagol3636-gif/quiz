<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KNOA YardBook</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KNOA YardBook">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0b3d0b;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
color:white;

}

header{

background:#062806;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
box-shadow:0 3px 10px rgba(0,0,0,.3);

}

.container{

max-width:900px;
margin:auto;
padding:20px;

}

.card{

background:#111;
border-radius:18px;
padding:20px;

animation:fade .35s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:none;

}

}

button{

width:100%;
padding:18px;
margin-top:12px;

border:none;

border-radius:15px;

background:#1b5e20;

color:white;

font-size:20px;

cursor:pointer;

transition:.15s;

}

button:active{

transform:scale(.97);

}

.row{

display:flex;
gap:10px;

}

.row button{

flex:1;

}

.imageArea{

margin-top:20px;

background:white;

border-radius:15px;

overflow:hidden;

padding:10px;

}

.imageArea img{

width:100%;
display:block;

touch-action:none;

transform-origin:center;

}

.topTitle{

text-align:center;

font-size:28px;

margin-bottom:10px;

}

.sub{

text-align:center;

opacity:.8;

margin-bottom:20px;

}

</style>

</head>

<body>

<header>

KNOA YardBook

</header>

<div class="container">

<div class="card" id="app">

</div>

</div>

<script>

const holes = [

{
name:"Hole1",
par:"PAR5",
yard:"575Y",

course:"IMG_4412.jpeg",
green:"IMG_4413.jpeg"

},

{
name:"Hole2",
par:"PAR4",
yard:"355Y",

course:"IMG_4412.jpeg",
green:"IMG_4413.jpeg"

},

{
name:"Hole3",
par:"PAR3",
yard:"190Y",

course:"IMG_4412.jpeg",
green:"IMG_4413.jpeg"

}

];

let currentHole=0;

let currentImage="course";

function showHome(){

document.getElementById("app").innerHTML=`

<div class="topTitle">
穂高カントリークラブ
</div>

<div class="sub">
OUT
</div>

<button onclick="openHole(0)">
① Hole1
</button>

<button onclick="openHole(1)">
② Hole2
</button>

<button onclick="openHole(2)">
③ Hole3
</button>

`;

}

function openHole(index){

currentHole=index;

currentImage="course";

drawHole();

}

function drawHole(){

const hole=holes[currentHole];

let img=(currentImage==="course")
?hole.course
:hole.green;

document.getElementById("app").innerHTML=`

<div class="topTitle">

${hole.name}

</div>

<div class="sub">

${hole.par}
&nbsp;&nbsp;
${hole.yard}

</div>

<div class="row">

<button onclick="showCourse()">
コース
</button>

<button onclick="showGreen()">
グリーン
</button>

</div>

<div class="imageArea">

<img
id="yardImage"
src="${img}"
>

</div>

<div class="row">

<button onclick="prevHole()">

← 前へ

</button>

<button onclick="nextHole()">

次へ →

</button>

</div>

<button onclick="showHome()">

ホームへ戻る

</button>

`;

}

function showCourse(){

currentImage="course";

drawHole();

}

function showGreen(){

currentImage="green";

drawHole();

}

function nextHole(){

if(currentHole<holes.length-1){

currentHole++;

drawHole();

}

}

function prevHole(){

if(currentHole>0){

currentHole--;

drawHole();

}

}

showHome();
